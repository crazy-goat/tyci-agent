name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract release notes from CHANGELOG.md
        # Reads CHANGELOG.md from the tagged commit: merge the `## [X.Y.Z]` section before tagging.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { found = (index($0, "[" v "]") > 0 || index($0, "[v" v "]") > 0); next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty section for ${version}"
            exit 1
          fi
          # GitHub rejects release notes over 125000 characters.
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import sys
          limit = 120000
          tag = sys.argv[1]
          text = open('release-notes.md', encoding='utf-8').read()
          if len(text) > limit:
              tail = ("\n\n_The notes were shortened because of the GitHub size limit. "
                      f"See [CHANGELOG.md](https://github.com/crazy-goat/tyci-agent/blob/{tag}/CHANGELOG.md) "
                      "for the full text._\n")
              text = text[:limit - len(tail)]
              text = text[:text.rfind('\n')] + tail
              open('release-notes.md', 'w', encoding='utf-8').write(text)
              print(f"::warning::Release notes truncated to {len(text)} characters")
          PY

      - name: Build binaries
        # Windows is not a supported target (unix-only syscalls).
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "Building ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/tyci_${os}_${arch}" .
          done
          (cd dist && sha256sum tyci_* > checksums.txt)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${flags[@]}" \
            dist/tyci_* dist/checksums.txt
