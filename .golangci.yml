version: "2"

linters:
  enable:
    - errcheck
    - unused
    - misspell
  settings:
    errcheck:
      # Best-effort calls whose errors carry no useful information.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - os.Remove
        - os.RemoveAll
    staticcheck:
      # Keep the bug checks (SA, S). Of the style (ST) and quickfix (QF) checks only
      # the ones listed here are enforced.
      checks: ["all", "-ST*", "-QF*", "ST1005", "ST1011", "QF1001", "QF1003", "QF1008", "QF1011", "QF1012"]
  exclusions:
    rules:
      # Tests set up and tear down state; unchecked errors there add noise only.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
