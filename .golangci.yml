version: "2"

linters:
  enable:
    - errcheck
    - unused
    - misspell

  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt

output:
  formats:
    colored-line-number:
      path: stdout

issues:
  # Ignore existing issues; only report new ones introduced by changes.
  new-from-rev: origin/main
